<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MySQL Web Client</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>MySQL Query Interface</h1>
        
        <div class="query-box">
            <label for="query-input">Execute SELECT query:</label>
            <textarea id="query-input" placeholder="SELECT * FROM table_name;"></textarea>
            <div id="error-display" class="error-msg"></div>
            <button id="send-btn">Send Query</button>
        </div>

        <div id="results-container" class="results-table-wrapper">
            <table id="results-table">
                <thead id="table-head"></thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>

        <div class="history-section">
            <h3>Command History</h3>
            <div id="history-list"></div>
        </div>
    </div>
    <script type="module" src="main.js"></script>
</body>
</html>
